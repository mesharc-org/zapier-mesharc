name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Offline tests only: the live ones need a MeshArc that can reach the runner.
      - run: npm test
      - name: App definition is valid for Zapier
        run: node -e "const s=require('zapier-platform-schema');const app=require('./index.js');const r=s.validateAppDefinition(JSON.parse(JSON.stringify(app,(k,v)=>typeof v==='function'?'\$func\$2\$f\$':v)));if(r.errors.length){console.error(r.errors.map(e=>e.property+' '+e.message).join('\n'));process.exit(1)}console.log('valid')"
